name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Structure, snippets & links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          python3 -m venv .venv
          .venv/bin/pip install --quiet pyyaml

      - name: Structure and versions
        run: .venv/bin/python scripts/validate.py

      - name: Type-check snippets against the pinned SDK
        run: npm run -s check:snippets

      - name: Hooks and scripts
        run: |
          curl -fsSL https://api.whop.com/api/v1/openapi.json -o "$RUNNER_TEMP/openapi.json"
          WHOP_OPENAPI_FILE="$RUNNER_TEMP/openapi.json" npm test

      - name: Docs links resolve
        run: python3 scripts/check-links.py
